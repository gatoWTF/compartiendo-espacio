<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .title{font-size:26px;font-weight:800;fill:#0f172a}
      .sub{font-size:13px;fill:#475569}
      .box-t{font-size:16px;font-weight:700}
      .box-s{font-size:11.5px}
      .tag{font-size:11px;font-weight:700;fill:#1e293b}
      .lyr{font-size:12px;font-weight:800;fill:#64748b;letter-spacing:1px}
      .edge{stroke:#475569;stroke-width:1.6;fill:none}
      .edgelbl{font-size:10.5px;fill:#64748b;font-weight:600}
    </style>
  </defs>

  <rect width="1120" height="840" fill="#f8fafc"/>
  <text x="40" y="46" class="title">Parkings Together — Arquitectura de Microservicios</text>
  <text x="40" y="68" class="sub">Monorepo Turborepo · BFF + 3 microservicios · API REST (HTTP/JSON) · PostgreSQL 17 + PostGIS</text>

  <!-- ===== CAPA CLIENTE ===== -->
  <text x="40" y="110" class="lyr">CLIENTE</text>
  <rect x="40" y="120" width="1040" height="70" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="60" y="150" class="box-t" fill="#4338ca">Navegador — PWA (Next.js / React)</text>
  <text x="60" y="172" class="box-s" fill="#475569">Leaflet (mapa) · Supabase Auth (JWT) · react-hot-toast · Service Worker (offline)</text>
  <rect x="840" y="135" width="220" height="40" rx="8" fill="#fff" stroke="#c7d2fe"/>
  <text x="950" y="160" text-anchor="middle" class="tag" fill="#4338ca">JavaScript · React</text>

  <!-- arrow cliente -> BFF -->
  <line x1="560" y1="190" x2="560" y2="232" class="edge" marker-end="url(#arrow)"/>
  <text x="572" y="216" class="edgelbl">HTTPS · same-origin · JSON</text>

  <!-- ===== CAPA BFF ===== -->
  <text x="40" y="252" class="lyr">BACKEND FOR FRONTEND (BFF) — orquestación</text>
  <rect x="40" y="262" width="1040" height="86" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="60" y="290" class="box-t" fill="#0e7490">apps/web — Route Handlers (Next.js)</text>
  <text x="60" y="312" class="box-s" fill="#475569">/api/mapas · /api/reservas · /api/resenas · /api/pagos · /api/favoritos · /api/premium · /api/support</text>
  <text x="60" y="332" class="box-s" fill="#475569">Inyección de JWT del usuario · agregación de respuestas · timeouts/AbortController · validación</text>
  <rect x="840" y="285" width="220" height="40" rx="8" fill="#fff" stroke="#a5f3fc"/>
  <text x="950" y="310" text-anchor="middle" class="tag" fill="#0e7490">Node.js · Next.js 16</text>

  <!-- arrows BFF -> microservicios -->
  <line x1="240" y1="348" x2="200" y2="408" class="edge" marker-end="url(#arrow)"/>
  <line x1="560" y1="348" x2="560" y2="408" class="edge" marker-end="url(#arrow)"/>
  <line x1="880" y1="348" x2="915" y2="408" class="edge" marker-end="url(#arrow)"/>
  <text x="540" y="382" class="edgelbl">REST /api/v1/*</text>

  <!-- ===== CAPA MICROSERVICIOS ===== -->
  <text x="40" y="398" class="lyr">MICROSERVICIOS (independientes, desplegables por separado)</text>

  <!-- ms-mapas -->
  <rect x="40" y="410" width="320" height="150" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="60" y="438" class="box-t" fill="#15803d">ms-mapas · :3002</text>
  <text x="60" y="460" class="box-s" fill="#475569">Búsqueda y gestión de plazas</text>
  <text x="60" y="480" class="box-s" fill="#334155">Patrón Controller → Service → Repository</text>
  <text x="60" y="500" class="box-s" fill="#334155">GET/POST/PATCH/DELETE /api/v1/search</text>
  <rect x="60" y="514" width="280" height="32" rx="7" fill="#fff" stroke="#bbf7d0"/>
  <text x="200" y="535" text-anchor="middle" class="tag" fill="#15803d">JavaScript · Next.js</text>

  <!-- ms-reservas -->
  <rect x="400" y="410" width="320" height="150" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="420" y="438" class="box-t" fill="#c2410c">ms-reservas · :3003</text>
  <text x="420" y="460" class="box-s" fill="#475569">Reservas transaccionales</text>
  <text x="420" y="480" class="box-s" fill="#334155">Patrón Saga + CQRS (compensación)</text>
  <text x="420" y="500" class="box-s" fill="#334155">POST /api/v1/reserve</text>
  <rect x="420" y="514" width="280" height="32" rx="7" fill="#fff" stroke="#fed7aa"/>
  <text x="560" y="535" text-anchor="middle" class="tag" fill="#c2410c">JavaScript · Next.js</text>

  <!-- auth -->
  <rect x="760" y="410" width="320" height="150" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="780" y="438" class="box-t" fill="#b91c1c">auth · :3001</text>
  <text x="780" y="460" class="box-s" fill="#475569">Autenticación y registro</text>
  <text x="780" y="480" class="box-s" fill="#334155">Patrón MVC (Controller→Service→Repo)</text>
  <text x="780" y="500" class="box-s" fill="#334155">POST /api/v1/auth/login · /register</text>
  <rect x="780" y="514" width="280" height="32" rx="7" fill="#fff" stroke="#fecaca"/>
  <text x="920" y="535" text-anchor="middle" class="tag" fill="#b91c1c">JavaScript · Next.js</text>

  <!-- arrows microservicios -> paquete compartido -->
  <line x1="200" y1="560" x2="430" y2="612" class="edge" marker-end="url(#arrow)"/>
  <line x1="560" y1="560" x2="560" y2="612" class="edge" marker-end="url(#arrow)"/>
  <line x1="920" y1="560" x2="690" y2="612" class="edge" marker-end="url(#arrow)"/>

  <!-- ===== PAQUETE COMPARTIDO ===== -->
  <rect x="360" y="614" width="400" height="58" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="380" y="640" class="box-t" fill="#7e22ce">packages/@parkings/supabase-db</text>
  <text x="380" y="660" class="box-s" fill="#475569">Cliente Supabase compartido — patrón Singleton · inyección de JWT</text>

  <line x1="560" y1="672" x2="560" y2="710" class="edge" marker-end="url(#arrow)"/>
  <text x="572" y="696" class="edgelbl">SQL · PostgREST · RPC</text>

  <!-- ===== CAPA PERSISTENCIA ===== -->
  <text x="40" y="700" class="lyr">PERSISTENCIA</text>
  <rect x="40" y="712" width="1040" height="98" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="740" class="box-t" fill="#0f172a">Supabase — PostgreSQL 17 + PostGIS</text>
  <text x="60" y="762" class="box-s" fill="#475569">Tablas: perfiles · vehiculos · estacionamientos · reservas · favoritos   |   RLS (Row Level Security) en todas</text>
  <text x="60" y="782" class="box-s" fill="#475569">Stored Procedures (PL/pgSQL): buscar_estacionamientos_radio · reservar_estacionamiento · calificar_reserva · obtener_resenas</text>
  <text x="60" y="800" class="box-s" fill="#475569">Realtime (WebSockets) para sincronización de plazas en el mapa</text>
  <rect x="840" y="730" width="220" height="40" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="950" y="755" text-anchor="middle" class="tag" fill="#0f172a">SQL · PL/pgSQL · PostGIS</text>
</svg>
